<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как часто общаться — состояния</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#626c77}a:hover{color:#1d2023}
</style>
</helmet>
<div style="width: 390px; height: 1820px; box-sizing: border-box; background: #ffffff; color: #1d2023; font-family: Onest, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">
  <sc-for list="{{states}}" as="st" hint-placeholder-count="6">
    <section style="padding: 24px 16px 28px; border-bottom: 1px solid #e2e7f7; display: flex; flex-direction: column; gap: 12px">
      <p style="margin: 0 0 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #626c77">{{st.caption}}</p>
      <fieldset style="border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <legend style="padding: 0; margin-bottom: 12px; font-size: 18px; line-height: 1.3; font-weight: 500">Как часто общаться</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{st.options}}" as="opt" hint-placeholder-count="5">
            <label style="position: relative; height: 44px; box-sizing: border-box; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid {{opt.border}}; border-radius: 999px; background: {{opt.bg}}; color: {{opt.fg}}; font-size: 15px; font-weight: 500">
              <input type="radio" name="{{st.name}}" value="{{opt.id}}" checked="{{opt.checked}}" onChange="{{noop}}" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
              {{opt.label}}
            </label>
          </sc-for>
        </div>
      </fieldset>
      <div style="min-height: 24px">
        <sc-if value="{{st.isSaving}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; display: flex; align-items: center; gap: 8px; color: #626c77; font-size: 15px">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>
            Сохраняю…
          </p>
        </sc-if>
        <sc-if value="{{st.isOverdue}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; display: flex; align-items: center; gap: 8px; color: #d6002a; font-weight: 500">
            <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #ff0032; flex-shrink: 0"></span>
            {{st.text}}
          </p>
        </sc-if>
        <sc-if value="{{st.isUpcoming}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; color: #626c77">{{st.text}}</p>
        </sc-if>
        <sc-if value="{{st.isError}}" hint-placeholder-val="{{ false }}">
          <p role="alert" style="margin: 0; display: flex; align-items: center; gap: 8px; color: #d6002a; font-size: 15px">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
            {{st.text}}
          </p>
        </sc-if>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selectedColor":{"editor":"color","options":["#1d2023","#d6002a"],"default":"#1d2023"},"$preview":{"width":390,"height":1820}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = [
      ['none', 'Не задано'],
      ['week', 'Раз в неделю'],
      ['month', 'Раз в месяц'],
      ['quarter', 'Раз в квартал'],
      ['year', 'Раз в год']
    ];
    const selectedColor = this.props.selectedColor ?? '#1d2023';
    const optionsFor = (current) => labels.map(([id, label]) => {
      const checked = id === current;
      return {
        id,
        label,
        checked,
        bg: checked ? selectedColor : '#ffffff',
        fg: checked ? '#ffffff' : '#1d2023',
        border: checked ? selectedColor : '#e2e7f7'
      };
    });
    const state = (name, caption, current, kind, text) => ({
      name,
      caption,
      options: optionsFor(current),
      isSaving: kind === 'saving',
      isOverdue: kind === 'overdue',
      isUpcoming: kind === 'upcoming',
      isError: kind === 'error',
      text: text || ''
    });
    return {
      noop: () => {},
      states: [
        state('s-none', 'Частота не задана: срока нет', 'none', 'none'),
        state('s-upcoming', 'Срок впереди', 'quarter', 'upcoming', 'Связаться до 16 декабря'),
        state('s-next-year', 'Срок в следующем году: виден год', 'year', 'upcoming', 'Связаться до 16 сентября 2027'),
        state('s-due', 'Срок подошёл, прошло меньше суток', 'week', 'overdue', 'Пора связаться: срок подошёл'),
        state('s-saving', 'Сразу после нажатия, идёт сохранение', 'quarter', 'saving'),
        state('s-error', 'Не сохранилось: контакт удалили в другой вкладке', 'month', 'error', 'Контакт не найден')
      ]
    };
  }
}
</script>
</body>
</html>
