# Production on the server: project "prod", files in /srv/personal-crm.
# Run through deploy.sh: it sets APP_TAG, the image tag (commit SHA) to run.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  image: ghcr.io/pmtwit/personal-crm:${APP_TAG:?run deploy.sh with the image tag}
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Login. The values live in the server's .env. Without one of them compose
    # stops on the first command of deploy.sh, before the backup: nothing changes
    # and the version that runs now keeps running
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -hex 32)}
    BETTER_AUTH_URL: https://app.pmcrm.site
    # Where the login letters go: Resend's SMTP, see README
    SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env (see README)}
    # The owner of the data that existed before login: the migration gives it
    # to the user with this email. See README
    OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env (see README)}
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # Postgres quotes a refused row in its log ("Failing row contains ..."):
    # terse leaves that detail out, so people's data stays out of the log
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published ports: only the app and the migrations reach it, inside this project
    # Since postgres:18 the data directory lives under /var/lib/postgresql
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits
  migrate:
    <<: *app
    command: ["node", "scripts/migrate.mts"]
    profiles: ["oneoff"]

  app:
    <<: *app
    restart: unless-stopped
    # Localhost only: the outside world reaches the app through nginx
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  pgdata:
