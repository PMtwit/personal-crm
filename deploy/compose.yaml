# One file for both environments on the server: prod (project "prod", files in
# /srv/personal-crm) and the test stand (project "staging", /srv/personal-crm-staging).
# Run through the scripts in this folder: use_environment in common.sh sets the
# environment's address, port and memory limits, deploy.sh sets APP_TAG, the
# image tag (commit SHA) to run. Each environment's own .env lies next to this file.

# Logs of every container go to the server's journal (journald), not to files
# of the container: they stay after a deploy or a rollback replaces it. The
# system limits the journal's size and drops its oldest lines, so the disk does
# not fill up. The tag names a line after its container (prod-app-1), the same
# in every version; the labels pick all lines of one environment or one
# service, the one-off migration containers too. How to read them: README, "Логи"
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"
    labels: com.docker.compose.project,com.docker.compose.service

x-app: &app
  image: ghcr.io/pmtwit/personal-crm:${APP_TAG:?run deploy.sh with the image tag}
  # 0 means no limit (prod); the test stand has one, see common.sh
  mem_limit: ${APP_MEMORY_LIMIT:?run the scripts in this folder, they set the environment}
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Login. The values live in the server's .env. Without one of them compose
    # stops on the first command of deploy.sh, before the backup: nothing changes
    # and the version that runs now keeps running
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -hex 32)}
    # The address of this environment: the link in a login letter leads here,
    # so a link asked for on the test stand opens the test stand
    BETTER_AUTH_URL: ${APP_URL:?run the scripts in this folder, they set the environment}
    # Where the login letters go: Resend's SMTP, see README
    SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env (see README)}
    # The owner of the data that existed before login: the migration gives it
    # to the user with this email. See README
    OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env (see README)}
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # Postgres quotes a refused row in its log ("Failing row contains ..."):
    # terse leaves that detail out, so people's data stays out of the log
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    mem_limit: ${DB_MEMORY_LIMIT:?run the scripts in this folder, they set the environment}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published ports: only the app and the migrations reach it, inside this
    # project. Each project has its own volume: prod_pgdata, staging_pgdata
    # Since postgres:18 the data directory lives under /var/lib/postgresql
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits
  migrate:
    <<: *app
    command: ["node", "scripts/migrate.mts"]
    profiles: ["oneoff"]

  app:
    <<: *app
    restart: unless-stopped
    # Localhost only: the outside world reaches the app through nginx.
    # Each environment has its own port: prod 3000, staging 3001
    ports:
      - "127.0.0.1:${APP_PORT:?run the scripts in this folder, they set the environment}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  pgdata:
