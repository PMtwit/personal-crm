# Test stand: nginx proxies test-app.pmcrm.site to the staging app container on
# 127.0.0.1:3001. Installed by hand as /etc/nginx/sites-available/test-app.pmcrm.site.conf;
# the deploy does not touch nginx (see README).
#
# The whole site asks for a login and password first (basic auth): the test
# stand holds a copy of prod's data. The password file is made by a person,
# see README; until it exists nobody gets in, whatever login and password.
#
# Uses the log format app_no_params from app.pmcrm.site.conf: nginx reads that
# file first (sites-enabled goes in alphabetical order)

server {
    listen 80;
    listen [::]:80;
    server_name test-app.pmcrm.site;

    access_log /var/log/nginx/access.log app_no_params;
    error_log /var/log/nginx/error.log crit;

    include snippets/letsencrypt-acme.conf;

    location / {
        return 301 https://test-app.pmcrm.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test-app.pmcrm.site;

    access_log /var/log/nginx/access.log app_no_params;
    # A lower level quotes the whole request when the app does not answer.
    # Such a request still shows in the access log, as 502
    error_log /var/log/nginx/error.log crit;

    # Its own certificate, renewed by certbot.timer: the shared one of
    # pmcrm.site and app.pmcrm.site stays as it is
    ssl_certificate /etc/letsencrypt/live/test-app.pmcrm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.pmcrm.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pmcrm_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Personal contacts: keep the test stand out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/test-app.pmcrm.site.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The password stays with nginx: the app never sees it
    proxy_set_header Authorization "";
    # Pages arrive in parts (Suspense): pass each part on right away
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }

    # Open without the password: the deploy checks the test stand from GitHub
    # through it. It answers only whether the app and its database are up
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
    }
}
