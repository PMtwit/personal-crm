# App: nginx proxies app.pmcrm.site to the app container on 127.0.0.1:3000.
# Installed by hand as /etc/nginx/sites-available/app.pmcrm.site.conf;
# the deploy does not touch nginx (see README)

# Search words and the names of deleted contacts travel in URL parameters, so
# the log keeps only the path. The Referer is left out: it repeats a page's full
# address, parameters included. Both server blocks below use this format
log_format app_no_params '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name app.pmcrm.site;

    access_log /var/log/nginx/access.log app_no_params;
    # A lower level quotes the whole request when the app does not answer.
    # Such a request still shows in the access log, as 502
    error_log /var/log/nginx/error.log crit;

    include snippets/letsencrypt-acme.conf;

    location / {
        return 301 https://app.pmcrm.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.pmcrm.site;

    access_log /var/log/nginx/access.log app_no_params;
    # A lower level quotes the whole request when the app does not answer.
    # Such a request still shows in the access log, as 502
    error_log /var/log/nginx/error.log crit;

    include snippets/pmcrm-ssl.conf;

    # Personal contacts: keep the app out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages arrive in parts (Suspense): pass each part on right away
        proxy_buffering off;
    }
}
