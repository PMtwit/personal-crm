name: CI

# Every pull request: lint, format, types, unit tests, e2e tests, image build.
# main accepts a PR only when the "CI passed" job is green
on:
  pull_request:

# A new push to the PR cancels the run for the previous commit
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A throwaway database inside the run, no password: it only accepts
  # connections from this machine. Tests create their own databases next to it
  DATABASE_URL: postgres://postgres@localhost:5432/crm
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm of the version pinned in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: crm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: crm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests run in Google Chrome, which the GitHub runner already has
      - run: pnpm test:e2e
      # Traces of failed tests: open with "pnpm exec playwright show-trace"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Only builds: the image is pushed to GHCR after merge to main (deploy.yml)
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check that main requires: green only when every job above is green.
  # A failed or skipped job makes it red, so new jobs need no settings change
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, unit-tests, e2e-tests, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job is green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
