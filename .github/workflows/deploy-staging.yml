name: Deploy staging

# Every push to main: build the image, push it to GHCR, deploy it to the test
# stand (staging, test-app.pmcrm.site). Prod gets the same image later, only
# when the owner starts "Deploy prod" (deploy-prod.yml): it takes a version
# whose deploy here went green
on:
  push:
    branches: [main]

# One run at a time, in the order of the pushes: an older version never lands
# after a newer one. A newer push waits for the running one to finish
concurrency:
  group: deploy-staging-push
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pmtwit/personal-crm
  SERVER: deploy@217.180.0.147
  APP_DIR: /srv/personal-crm-staging
  APP_URL: https://test-app.pmcrm.site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Always take the latest node:24-slim, with its security fixes
          pull: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # One deploy of the test stand at a time, whichever run starts it: a second
    # one waits. The server has its own lock in the test stand's folder
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # GitHub keeps the history of deploys of the test stand (Deployments).
    # "Deploy prod" reads it: prod only gets a version that went green here
    environment:
      name: staging
      url: https://test-app.pmcrm.site
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The server's host key: SSH refuses to talk to any other machine
          echo "217.180.0.147 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIvufsWQh68fUmn7JyKKdConhhK4KLAK0Mzh9fXajgi2" > ~/.ssh/known_hosts

      # Everything in deploy/ into the test stand's folder, so a new script
      # arrives by itself. A glob, not the folder itself: the folder on the
      # server keeps its own permissions
      - name: Copy deploy scripts
        run: scp -rp deploy/* "$SERVER:$APP_DIR/"

      # Migrations, the new app, smoke check of /health. The registry token
      # goes on stdin and only lives until this job ends
      - name: Deploy
        env:
          TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh "$SERVER" "$APP_DIR/deploy.sh staging $TAG $REGISTRY_USER"

      # On the test stand /health is the one address open without its password
      - name: Smoke check through nginx
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$APP_URL/health"

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          commit="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          if [ "$JOB_STATUS" = success ]; then
            echo "The test stand runs [\`$GITHUB_SHA\`]($commit). \"Deploy prod\" with an empty SHA deploys this version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deploy of [\`$GITHUB_SHA\`]($commit) to the test stand failed, nothing was rolled back. \"Deploy prod\" will not take this version" >> "$GITHUB_STEP_SUMMARY"
          fi
